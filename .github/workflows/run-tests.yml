name: Build project
on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  tests-all-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kspVersion: [
          '2.0.0-1.0.24',
          '2.0.10-1.0.24',
          '2.0.21-1.0.28',
          '2.1.0-1.0.29',
          '2.1.10-1.0.31',
          '2.1.21-2.0.2',
          '2.2.0-2.0.2',
          '2.2.10-2.0.2',
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - run: ./gradlew :sweetspi-tests:test --continue -Psweetbuild.tests.kspVersion=${{ matrix.kspVersion }}
