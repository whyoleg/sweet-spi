group=dev.whyoleg.sweetspi
version=0.1.2
#Kotlin
kotlin.mpp.import.enableKgpDependencyResolution=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.wasm.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.ignoreIncorrectDependencies=true
kotlin.js.browser.karma.browsers=chrome-headless
kotlin.js.yarn=false
# current KSP version to run integration tests
sweetbuild.tests.kspVersion=2.2.20-RC-2.0.2
#Gradle
org.gradle.kotlin.dsl.skipMetadataVersionCheck=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g
